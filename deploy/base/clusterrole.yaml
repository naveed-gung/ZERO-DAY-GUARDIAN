apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guardian-monitor
  labels:
    app.kubernetes.io/name: zero-day-guardian
    app.kubernetes.io/component: monitor
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: guardian-system
  name: guardian-operator
  labels:
    app.kubernetes.io/name: zero-day-guardian
    app.kubernetes.io/component: operator
rules:
  # GuardianPolicy CRD management
  - apiGroups: ["guardian.zerodayguardian.io"]
    resources: ["guardianpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["guardian.zerodayguardian.io"]
    resources: ["guardianpolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["guardian.zerodayguardian.io"]
    resources: ["guardianpolicies/finalizers"]
    verbs: ["update"]
  # DaemonSet lifecycle
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Event creation
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Namespace and node awareness
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # ServiceAccount management
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
