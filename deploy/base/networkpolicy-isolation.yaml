# Optional additive NetworkPolicy example. Existing allow rules still apply.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: guardian-quarantine-template
  namespace: guardian-system
  labels:
    app.kubernetes.io/name: zero-day-guardian
    app.kubernetes.io/component: quarantine
  annotations:
    guardian.zerodayguardian.io/description: >
      Selects Guardian-labeled pods in this namespace. Applicable allow policies
      can still permit traffic. Use the Cilium example for explicit deny rules.
spec:
  # Selector matches quarantined pods
  podSelector:
    matchLabels:
      guardian.zerodayguardian.io/quarantined: "true"
  policyTypes:
    - Ingress
    - Egress
  # Empty ingress/egress = deny all traffic
  ingress: []
  egress: []
