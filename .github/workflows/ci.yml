name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/zero-day-guardian

jobs:
  # ------------------------------------------------------------------
  # Rust eBPF Monitor
  # ------------------------------------------------------------------
  rust-check:
    name: Rust - Check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ebpf-monitor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy, rust-src

      - name: Install bpf-linker
        run: bash install-bpf-linker.sh "$HOME/.cargo/bin"

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ebpf-monitor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ebpf-monitor/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lint (userspace)
        run: cargo clippy --workspace --exclude ebpf-monitor-ebpf -- -D warnings

      - name: Build userspace + eBPF programs
        run: cargo build --release

      - name: Run tests
        run: cargo test --workspace --exclude ebpf-monitor-ebpf

  rust-docker:
    name: Rust - Docker Build
    needs: rust-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push ebpf-monitor
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ebpf-monitor
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/ebpf-monitor:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/ebpf-monitor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Java Detection Engine
  # ------------------------------------------------------------------
  java-check:
    name: Java - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detection-engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js for Bazaar
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Run the Bazaar demo
        run: python3 -B ../examples/bazaar_demo.py

      - name: Run the EduFlow demo
        run: python3 ../examples/eduflow/demo.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: java-test-results
          path: detection-engine/build/reports/tests/

  java-docker:
    name: Java - Docker Build
    needs: java-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push detection-engine
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: detection-engine
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/detection-engine:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/detection-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Go Kubernetes Operator
  # ------------------------------------------------------------------
  go-check:
    name: Go - Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guardian-operator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
          cache-dependency-path: guardian-operator/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/manager ./cmd/main.go

      - name: Test
        run: go test ./... -coverprofile=coverage.out -v

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: guardian-operator/coverage.out

  go-docker:
    name: Go - Docker Build
    needs: go-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push guardian-operator
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: guardian-operator
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/guardian-operator:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/guardian-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Kubernetes Manifests Validation
  # ------------------------------------------------------------------
  manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2

      - name: Validate dev overlay
        run: kustomize build deploy/overlays/dev > /dev/null

      - name: Validate prod overlay
        run: kustomize build deploy/overlays/prod > /dev/null

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate with kubeconform
        run: |
          kustomize build deploy/overlays/dev | kubeconform -strict -ignore-missing-schemas -summary
          kustomize build deploy/overlays/prod | kubeconform -strict -ignore-missing-schemas -summary

      - name: Block committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          severity: CRITICAL,HIGH
          exit-code: "1"

      # The eBPF node monitor intentionally uses host access. Keep those
      # findings visible alongside dependency advisories in an audit report.
      - name: Report dependency and configuration findings
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH
          format: table
          output: guardian-security-report.txt
          exit-code: "0"

      - name: Publish source security report
        if: always()
        run: |
          if [[ -s guardian-security-report.txt ]]; then
            printf '### Trivy source audit (high and critical)\n\n' >> "$GITHUB_STEP_SUMMARY"
            printf '```text\n' >> "$GITHUB_STEP_SUMMARY"
            cat guardian-security-report.txt >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload source security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guardian-source-security-report
          path: guardian-security-report.txt

  # ------------------------------------------------------------------
  # Security Scanning
  # ------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [rust-docker, java-docker, go-docker]
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        image:
          - ebpf-monitor
          - detection-engine
          - guardian-operator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
